<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>trading-bots plotter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0b0e13; --panel:#131922; --panel2:#1a2230; --line:#273140; --text:#dde4ec; --muted:#8b98a9; --accent:#58a6ff; --green:#3fb950; --red:#f85149; --amber:#d29922; --mono: ui-monospace, Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 system-ui, sans-serif; display:flex; flex-direction:column; overflow:hidden; }
  .top { flex:none; display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  .top h1 { font-size:15px; margin:0 8px 6px 0; }
  label.f { display:flex; flex-direction:column; gap:2px; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  select, input, button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:13px system-ui, sans-serif; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); color:var(--accent); }
  button.on { border-color:var(--accent); color:var(--accent); }
  .meta { color:var(--muted); font-size:12px; }
  .body { flex:1; min-height:0; display:grid; grid-template-columns: var(--side-w, 420px) 6px 1fr; }
  #split { cursor: col-resize; background: var(--line); }
  #split:hover, #split.on { background: var(--accent); }
  .side { border-right:1px solid var(--line); overflow:auto; min-height:0; }
  .side table { width:100%; border-collapse:collapse; font-size:12px; }
  .side th, .side td { padding:4px 6px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  .side th { position:sticky; top:0; background:var(--panel); color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.05em; }
  .side tr.o { cursor:pointer; } .side tr.o:hover td { background:var(--panel2); } .side tr.sel td { background:#1f2a3a; }
  .mono { font-family:var(--mono); font-size:11px; }
  tr.o:hover > td { background:var(--panel2); }
  td.cloid { cursor:pointer; color:var(--muted); }
  td.cloid:hover { color:var(--accent); }
  .b { font-family:var(--mono); font-size:10px; padding:2px 6px; border-radius:999px; border:1px solid; text-transform:uppercase; }
  .b-filled, .b-ok { color:var(--green); border-color:var(--green); }
  .b-rejected, .b-failed, .b-error { color:var(--red); border-color:var(--red); }
  .b-resting, .b-sent, .b-partially_filled { color:var(--amber); border-color:var(--amber); }
  .b-fill { color:var(--green); border-color:var(--green); }
  .b-amend, .b-cancel_sent, .b-cancelled { color:var(--accent); border-color:var(--accent); }
  .b-unknown, .b-left_resting { color:var(--muted); border-color:var(--muted); }
  td.venue { color:var(--amber); }
  .side tr.ev-sel td { background:#1f2a3a; }
  .b-cancelled, .b-left_resting, .b-unknown { color:var(--muted); border-color:var(--muted); }
  .buy { color:var(--green); } .sell { color:var(--red); }
  #plotwrap { position:relative; width:100%; height:100%; min-height:0; overflow:hidden; }
  /* A window on its way: the plot dims and says so, the pointer says so. */
  #plotwrap.loading { cursor:progress; }
  #plotwrap.loading::after { content:"loading window\2026"; position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center; background:rgba(11,14,19,.45); color:var(--text); font:14px system-ui, sans-serif; letter-spacing:.02em; pointer-events:none; }
  #plot { display:block; cursor:crosshair; }
  #tip { position:absolute; z-index:2; pointer-events:none; background:#1a2230f2; border:1px solid var(--line); border-radius:6px; padding:6px 9px; font:11px/1.45 var(--mono); color:var(--text); max-width:520px; white-space:nowrap; }
  #tip[hidden] { display:none; }
  #tip.pinned { pointer-events:auto; border-color: var(--accent); box-shadow: 0 8px 28px rgba(0,0,0,.5); white-space:normal; max-width:560px; }
  #tip .tip-hint { color: var(--muted); margin-top:6px; border-top:1px solid var(--line); padding-top:5px; }
  .legend button.lg { display:inline-flex; align-items:center; gap:5px; padding:2px 7px; font-size:11px; border-radius:999px; }
  .legend button.lg.off { opacity:.35; text-decoration:line-through; }
  .legend .help { margin-left:auto; }
  .legend { flex:none; display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:6px 14px; color:var(--muted); font-size:11px; border-bottom:1px solid var(--line); }
  .legend span b { font-weight:600; color:var(--text); }
  #status { padding:8px 14px; color:var(--muted); font-size:12px; }
  #status.err { color:var(--red); }
</style>
</head>
<body>
<div class="top">
  <h1>trading-bots plotter</h1>
  <label class="f">bot <select id="bot"></select></label>
  <label class="f" title="the strategy entry; an instrument traded by two strategies (in different accounts) is listed under each">strategy <select id="strategy"></select></label>
  <label class="f">instrument <select id="instrument"></select></label>
  <label class="f">filter <input id="search" class="mono" style="width:120px" placeholder="type to filter"></label>
  <span id="instcount" class="meta"></span>
  <label class="f">mode <select id="mode"><option value="live" selected>live</option><option value="dummy">dummy</option><option value="">live + dummy</option></select></label>
  <label class="f">window <select id="span">
    <option value="20000">20 s</option><option value="60000" selected>1 min</option><option value="180000">3 min</option>
    <option value="600000">10 min</option><option value="1800000">30 min</option><option value="3600000">1 h</option>
  </select></label>
  <label class="f" title="EMA of the Hyperliquid mid, the bot's own definition (time-based half-life); 0 = off">hl mid ema (ms) <input id="ema" class="mono" type="number" min="0" step="10" value="0" style="width:70px" placeholder="0 = off"></label>
  <label class="f" title="the exit slope's two EMA half-lives (taker.exit.slope_exit.fast_ms / slow_ms): slope = (fast - slow) / (tau_slow - tau_fast), bps of the mid per second, on the right axis of the lower pane; 0 in either = off">slope emas fast/slow (ms)
    <span style="display:flex;gap:3px"><select id="slopesrc" title="taker.exit.slope_exit.source: whose mid the slope is of"><option value="lagger" selected>lagger</option><option value="leader">leader</option></select><input id="slopefast" class="mono" type="number" min="0" step="10" value="100" style="width:62px"><input id="slopeslow" class="mono" type="number" min="0" step="10" value="400" style="width:62px"></span></label>
  <label class="f" title="the impulse gate (taker.entry.leader_impulse_halftime_ms / leader_impulse_min_bps): how far the leader's latest mid stands from its EMA at this half-life, bps, on the lower pane with the threshold dashed; 0 = off">leader impulse hl (ms) / min (bps)
    <span style="display:flex;gap:3px"><input id="impulsehl" class="mono" type="number" min="0" step="10" value="80" style="width:62px"><input id="impulsemin" class="mono" type="number" min="0" step="1" value="8" style="width:52px"><input id="impulsefrac" class="mono" type="number" min="0" max="1" step="0.05" value="0.5" style="width:52px" title="leader_impulse_fraction: the gate also wants this fraction of the deviation"></span></label>
  <label class="f" title="taker.signal.basis_halftime_ms: the slow EMA of the edge the deviation is measured against; 0 = plot the raw edge">basis hl (ms) <input id="basishl" class="mono" type="number" min="0" step="1000" value="30000" style="width:70px"></label>
  <label class="f">centre (UTC) <input id="centre" class="mono" style="width:190px" placeholder="click an order, or type"></label>
  <label class="f">from (UTC) <input id="from" class="mono" style="width:190px" placeholder="exact range, overrides window"></label>
  <label class="f">to (UTC) <input id="to" class="mono" style="width:190px" placeholder="blank = use window"></label>
  <button id="prev" title="shift the window back">&larr;</button>
  <button id="next" title="shift the window forward">&rarr;</button>
  <button id="latest" title="the newest order of this key">latest</button>
  <button id="reload">reload</button>
  <span id="paramsrc" class="meta" title="where the gate and slope inputs came from"></span>
  <span id="status"></span>
  <span id="cursor" class="mono meta"></span>
</div>
<div class="legend" id="legend"></div>
<div class="body">
  <div class="side">
    <table id="events"><thead><tr><th title="the event's own clock: ours for what we sent, the venue's for a fill">at (UTC)</th><th>event</th><th>cloid</th><th>side</th><th>px</th><th>sz</th><th>note</th></tr></thead><tbody></tbody></table>
  </div>
  <div id="split" title="drag to resize"></div>
  <div id="plotwrap"><canvas id="plot"></canvas><div id="tip" hidden></div></div>
</div>
<script src="/app.js"></script>
</body>
</html>
